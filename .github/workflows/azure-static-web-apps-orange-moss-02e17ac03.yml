name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Materialize SOGOD V2 part 1
        run: node scripts/sogod-v2-part-1.mjs
      - name: Materialize SOGOD V2 part 2
        run: node scripts/sogod-v2-part-2.mjs
      - name: Materialize SOGOD V2 part 3A1
        run: node scripts/sogod-v2-part-3a1.mjs
      - name: Materialize SOGOD V2 part 3A2
        run: node scripts/sogod-v2-part-3a2.mjs
      - name: Materialize SOGOD V2 part 3B
        run: node scripts/sogod-v2-part-3b.mjs
      - name: Materialize SOGOD V2 part 4
        run: node scripts/sogod-v2-part-4.mjs
      - name: Materialize SOGOD V2 part 5
        run: node scripts/sogod-v2-part-5.mjs
      - name: Validate SOGOD V2 JavaScript
        run: |
          node --check api/src/domain.js
          node --check api/src/index.js
          node --check api/src/proposals.js
          node --check api/src/store.js
          node --check assets/js/frontdesk.js
          node --check assets/js/proposal-editor.js
          node --check assets/js/proposal.js
          node --check assets/js/request.js
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MOSS_02E17AC03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "."

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_MOSS_02E17AC03 }}
          action: "close"
